name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build checksum-bearing assets
        run: python3 tools/package.py --version "${GITHUB_REF_NAME#v}"
      - name: Generate install repository index
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 tools/generate_index.py --repo "$GITHUB_REPOSITORY" --version "$version" \
            --dist-dir "dist/$version" --output "dist/$version/index.json"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/$version/"* \
            --verify-tag --title "Sonarr & Radarr Autoscan $version" --generate-notes

  install-index:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: spark
      - name: Publish released index on spark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          current=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [ "$current" != "$version" ]; then
            echo "::notice::Spark has moved to another version; release asset index remains available."
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern index.json --dir "$RUNNER_TEMP/autoscan-index"
          cp "$RUNNER_TEMP/autoscan-index/index.json" index.json
          git add index.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish install index for $GITHUB_REF_NAME"
          git push origin HEAD:spark
